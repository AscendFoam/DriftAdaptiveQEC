  <title id="title">T75-FIG-M02 FR6 bounded multi-seed mechanism and intervention view</title>
  <desc id="desc">Main-text figure for the bounded FR6 six-seed mechanism evidence. Panel A shows baseline gap mean Gated v5 minus mean Full. Panel B shows the lower-clip intervention delta mean I1 minus baseline. The figure is descriptive only.</desc>
