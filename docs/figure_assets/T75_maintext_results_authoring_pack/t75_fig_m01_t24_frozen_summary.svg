<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">T75-FIG-M01 Frozen T24 four-scenario summary</title>
  <desc id="desc">Main-text figure for the frozen T24 benchmark. Four scenarios are shown as paired dots for hybrid_residual_b and ukf. Lower final LER is better. This is a frozen-set mock-backed software-HIL ranking only.</desc>
