<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">T75-FIG-A01 Layered deployment-adjacent boundary schematic</title>
  <desc id="desc">Appendix boundary figure showing the layered relationship between the frozen simulation mainline, the isolated true TFLite runtime lane, the read-only real-board gate lane, and the still-blocked unified deployment closure slot.</desc>
  <rect width="1280" height="760" fill="#ffffff"/>
  <rect x="44" y="36" width="1192" height="688" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="82" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#7c3aed">T75-FIG-A01  Appendix</text>
  <text x="82" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Layered boundary map for deployment-adjacent evidence</text>
  <text x="82" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">Upstream IDs: T74-FIG-03, T74-TBL-05, T74-TBL-06, T74-SUP-03, T74-SUP-04   T74-FIG-04 stays blocked</text>

  <rect x="82" y="196" width="720" height="142" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="112" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Layer 1. Frozen simulation / material mainline</text>
  <text x="112" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0f172a">T24 frozen ranking, FR6/FR7 bounded mechanism evidence,</text>
  <text x="112" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0f172a">and T50 material reproducibility boundary.</text>
  <text x="112" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Supported wording: frozen-set result, bounded explanatory layer, canonical material chain.</text>
  <text x="112" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#b91c1c">Not supported: expanded benchmark, runtime closure, board-level validation.</text>

  <line x1="442" y1="338" x2="442" y2="370" stroke="#94a3b8" stroke-width="4"/>
  <polygon points="442,384 432,364 452,364" fill="#94a3b8"/>
  <text x="466" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">does not auto-upgrade</text>

  <rect x="82" y="388" width="720" height="142" rx="20" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="112" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#155e75">Layer 2. Isolated true .tflite runtime lane</text>
  <text x="112" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0f172a">T48: selected preserved float/int8 artifacts execute</text>
  <text x="112" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0f172a">in an isolated current-host interpreter.</text>
  <text x="112" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Supported wording: isolated current-host true runtime only.</text>
  <text x="112" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#b91c1c">Not supported: default-env recovery, HIL closure, deployment closure.</text>

  <line x1="442" y1="530" x2="442" y2="562" stroke="#94a3b8" stroke-width="4"/>
  <polygon points="442,576 432,556 452,556" fill="#94a3b8"/>
  <text x="466" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">still not a board-success claim</text>

  <rect x="82" y="580" width="720" height="118" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="112" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#9a3412">Layer 3. Read-only real-board gate / provenance lane</text>
  <text x="112" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0f172a">T49/T71/T72: replay, regeneration, and provenance hardening</text>
  <text x="112" y="674" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0f172a">all retain current-host NO_GO.</text>
  <text x="112" y="694" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#b91c1c">Not supported: real-board execution success, hardware validation, P3 real-board HIL complete.</text>

  <rect x="848" y="220" width="328" height="340" rx="22" fill="#fef2f2" stroke="#ef4444" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1012" y="268" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#991b1b">Blocked slot</text>
  <text x="1012" y="306" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#7f1d1d">T74-FIG-04</text>
  <text x="1012" y="340" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a">Unified portability /</text>
  <text x="1012" y="368" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a">deployment closure figure</text>
  <text x="1012" y="414" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#7f1d1d">This slot remains blocked.</text>
  <text x="1012" y="442" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#7f1d1d">T75 must not author it into existence.</text>
  <text x="1012" y="490" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Reason:</text>
  <text x="1012" y="516" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">the runtime lane is isolated-current-host only,</text>
  <text x="1012" y="540" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">and the real-board lane remains NO_GO.</text>

  <line x1="802" y1="450" x2="848" y2="450" stroke="#ef4444" stroke-width="3"/>
  <polygon points="848,450 828,440 828,460" fill="#ef4444"/>

  <rect x="848" y="592" width="328" height="94" rx="16" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="872" y="626" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#5b21b6">Appendix authoring role</text>
  <text x="872" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0f172a">Explain where the evidence layers stop.</text>
  <text x="872" y="674" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0f172a">Do not compress them into a success narrative.</text>

  <rect x="82" y="696" width="1094" height="20" rx="10" fill="#ddd6fe"/>
  <text x="98" y="710" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4c1d95">Boundary note: appendix-only explanation of where the current evidence layers stop. It is not a deployment-success or portability-closure figure.</text>
</svg>
