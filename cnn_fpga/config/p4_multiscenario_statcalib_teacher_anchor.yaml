experiment:
  name: T67_statcalib_teacher_anchor
  stage: p4_benchmark
  seed: 20260601

base_config: p4_multiscenario_statcalib_extension_lane.yaml

p4_benchmark:
  protocol:
    protocol_id: t67_statcalib_teacher_anchor_v1
    frozen_baseline_set: [ukf, hybrid_residual_b]

  modes:
    - name: ukf
      label: UKF
      slow_loop_mode: ukf
      overrides:
        slow_loop:
          ukf:
            initial_velocity_std_sigma: 0.008
            initial_velocity_std_mu_q: 0.008
            initial_velocity_std_mu_p: 0.008
            initial_velocity_std_theta_deg: 0.6
            process_std_sigma: 0.006
            process_std_mu_q: 0.006
            process_std_mu_p: 0.006
            process_std_theta_deg: 0.45
            process_std_v_sigma: 0.0015
            process_std_v_mu_q: 0.0015
            process_std_v_mu_p: 0.0015
            process_std_v_theta_deg: 0.12
            measurement_std_sigma: 0.08
            measurement_std_mu_q: 0.05
            measurement_std_mu_p: 0.05
            measurement_std_theta_deg: 4.0
            alpha: 0.3
            beta: 2.0
            kappa: 0.0

    - name: hybrid_residual_b
      label: Hybrid Residual-B
      slow_loop_mode: hybrid_residual_b
      artifact_selector: latest_float
      overrides:
        paths:
          model_dir: artifacts/models/runtime_b_residual_v1
        slow_loop:
          inference_service:
            label_names: [b_q, b_p]
          hybrid_residual_b:
            teacher_mode: window_variance
            context_windows: 5
            context_padding: edge_repeat
            include_histogram_deltas: true
            include_teacher_prediction: true
            include_teacher_params: true
            include_teacher_deltas: true
            residual_scale_b: 1.0
            residual_clip_b: 0.12
            ema_alpha: 0.35
            ema_apply_to: b

    - name: statcalib_default_teacher_ukf
      label: StatCalib Default (Teacher UKF)
      slow_loop_mode: statcalib
      overrides:
        slow_loop:
          statcalib:
            teacher_mode: ukf
            residual_scale_b: 0.50
            residual_clip_b: 0.08
            signal_threshold: 0.001
        postprocess:
          ema_alpha: 1.0
          ema_apply_to: b

    - name: statcalib_default_teacher_window_variance
      label: StatCalib Default (Teacher Window-Variance)
      slow_loop_mode: statcalib
      overrides:
        slow_loop:
          statcalib:
            teacher_mode: window_variance
            residual_scale_b: 0.50
            residual_clip_b: 0.08
            signal_threshold: 0.001
        postprocess:
          ema_alpha: 1.0
          ema_apply_to: b

    - name: statcalib_default_teacher_ekf
      label: StatCalib Default (Teacher EKF)
      slow_loop_mode: statcalib
      overrides:
        slow_loop:
          statcalib:
            teacher_mode: ekf
            residual_scale_b: 0.50
            residual_clip_b: 0.08
            signal_threshold: 0.001
        postprocess:
          ema_alpha: 1.0
          ema_apply_to: b

    - name: statcalib_high_threshold_teacher_ukf
      label: StatCalib High-Threshold (Teacher UKF)
      slow_loop_mode: statcalib
      overrides:
        slow_loop:
          statcalib:
            teacher_mode: ukf
            residual_scale_b: 0.50
            residual_clip_b: 0.08
            signal_threshold: 0.010
        postprocess:
          ema_alpha: 1.0
          ema_apply_to: b

    - name: statcalib_high_threshold_teacher_window_variance
      label: StatCalib High-Threshold (Teacher Window-Variance)
      slow_loop_mode: statcalib
      overrides:
        slow_loop:
          statcalib:
            teacher_mode: window_variance
            residual_scale_b: 0.50
            residual_clip_b: 0.08
            signal_threshold: 0.010
        postprocess:
          ema_alpha: 1.0
          ema_apply_to: b

    - name: statcalib_high_threshold_teacher_ekf
      label: StatCalib High-Threshold (Teacher EKF)
      slow_loop_mode: statcalib
      overrides:
        slow_loop:
          statcalib:
            teacher_mode: ekf
            residual_scale_b: 0.50
            residual_clip_b: 0.08
            signal_threshold: 0.010
        postprocess:
          ema_alpha: 1.0
          ema_apply_to: b
