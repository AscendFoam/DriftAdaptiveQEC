experiment:
  name: T59_statcalib_lane_smoke
  stage: p4_benchmark
  seed: 20260526

base_config: p4_multiscenario_hybrid_b.yaml

p4_benchmark:
  protocol:
    protocol_id: t59_statcalib_lane_smoke_v1
    report_template_version: p4_hil_report_v1
    repeats: 1
    scenario_seed_stride: 1000
    mode_seed_stride: 100000
    real_board_policy: conditional_extension
    frozen_baseline_set: [ukf, hybrid_residual_b, statcalib]

  modes:
    - name: ukf
      label: UKF
      slow_loop_mode: ukf

    - name: hybrid_residual_b
      label: Hybrid Residual-B
      slow_loop_mode: hybrid_residual_b
      artifact_selector: latest_float
      overrides:
        paths:
          model_dir: artifacts/models/runtime_b_residual_v1
        slow_loop:
          inference_service:
            label_names: [b_q, b_p]
          hybrid_residual_b:
            teacher_mode: window_variance
            context_windows: 5
            context_padding: edge_repeat
            include_histogram_deltas: true
            include_teacher_prediction: true
            include_teacher_params: true
            include_teacher_deltas: true
            residual_scale_b: 1.0
            residual_clip_b: 0.12
            ema_alpha: 0.35
            ema_apply_to: b

    - name: statcalib
      label: StatCalib Comparator
      slow_loop_mode: statcalib
      overrides:
        slow_loop:
          statcalib:
            teacher_mode: ukf
            residual_scale_b: 0.50
            residual_clip_b: 0.08
            signal_threshold: 0.001
        postprocess:
          ema_alpha: 1.0
          ema_apply_to: b

  scenarios:
    - name: static_bias_theta
      label: Static Bias+Theta
      overrides:
        mock_signal:
          type: static
          sigma0: 0.22
          sigma_min: 0.22
          sigma_max: 0.22
          mu_q0: 0.035
          mu_p0: -0.025
          theta_deg0: 4.0

    - name: linear_ramp
      label: Linear Ramp
      overrides:
        mock_signal:
          type: linear
          sigma0: 0.14
          sigma_min: 0.08
          sigma_max: 0.45
          sigma_alpha: 1.0e-7
          mu_q0: 0.010
          mu_p0: -0.010
          theta_deg0: 2.0
          theta_step_std_deg: 0.10
