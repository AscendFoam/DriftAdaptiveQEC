experiment:
  name: p4_multiscenario_recovery_smoke
  stage: p4_benchmark_recovery
  seed: 20260507

base_config: p4_multiscenario_smoke.yaml

paths:
  output_root: runs
  model_dir: artifacts/models/static_theta_v2

timing:
  n_slow_updates: 8
  n_fast_cycles: 32000

slow_loop:
  mode: model_artifact
  model_artifact:
    path: artifacts/models/static_theta_v2/tiny_cnn_20260319_151717_b87c6c227b57.npz
    use_latest_model_dir_artifact: false
    artifact_selector: latest_float
  inference_service:
    mode: inproc
    backend: artifact_npz
    model_path: artifacts/models/static_theta_v2/tiny_cnn_20260319_151717_b87c6c227b57.npz
    use_latest_model_dir_artifact: false
    artifact_selector: latest_float

hil:
  backend: mock

error_model:
  dma_timeout_prob: 0.0
  axi_write_fail_prob: 0.0
  cnn_infer_fail_prob: 0.0

p4_benchmark:
  protocol:
    protocol_id: p4_hil_recovery_smoke_v1
    report_template_version: p4_hil_report_v1
    repeats: 1
    scenario_seed_stride: 1000
    mode_seed_stride: 100000
    seed_pairing: paired
    real_board_policy: conditional_extension
    frozen_baseline_set: [static_linear, window_variance, ekf, cnn_fpga]
